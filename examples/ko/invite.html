<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="10월 10일 성수에서 열리는 클라우드베리 팝업 행사 초대장">
  <link rel="icon" href="data:,">
  <title>종이와 호박 — 클라우드베리 팝업</title>
  <style>
    :root {
      --paper: #f4e7ca;
      --paper-light: #fffaf0;
      --pumpkin: #df682f;
      --pumpkin-dark: #9f3f22;
      --ink: #2f261f;
      --leaf: #526148;
      --line: rgba(91, 55, 31, 0.18);
      --shadow: rgba(84, 48, 24, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 250, 240, 0.9) 0 7%, transparent 7.2%),
        radial-gradient(circle at 92% 88%, rgba(223, 104, 47, 0.22) 0 10%, transparent 10.2%),
        var(--paper);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0 5px,
        rgba(91, 55, 31, 0.025) 5px 6px
      );
      content: "";
      pointer-events: none;
    }

    .invite {
      width: min(1120px, calc(100% - 40px));
      margin: 40px auto;
      overflow: hidden;
      background: var(--paper-light);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 70px var(--shadow);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      min-height: 610px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(42px, 7vw, 88px);
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 28px;
      padding: 9px 14px;
      color: var(--pumpkin-dark);
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: #f8ddbd;
      border-radius: 999px;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-family: Georgia, "Times New Roman", "Batang", serif;
      font-size: clamp(3rem, 7vw, 6.2rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-top: 0.18em;
      color: var(--pumpkin);
    }

    .intro {
      max-width: 610px;
      margin: 30px 0 36px;
      font-size: clamp(1.1rem, 2vw, 1.3rem);
      line-height: 1.7;
      word-break: keep-all;
    }

    .event-details {
      display: grid;
      gap: 12px;
      margin: 0;
    }

    .event-details div {
      display: grid;
      grid-template-columns: 76px 1fr;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .event-details dt {
      color: var(--pumpkin-dark);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .event-details dd {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      font-weight: 700;
      line-height: 1.5;
    }

    .hero-art {
      position: relative;
      display: grid;
      min-height: 420px;
      place-items: center;
      overflow: hidden;
      background: var(--pumpkin);
    }

    .hero-art::before,
    .hero-art::after {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 250, 240, 0.42);
      border-radius: 50%;
      content: "";
    }

    .hero-art::before {
      top: -105px;
      right: -75px;
    }

    .hero-art::after {
      bottom: -140px;
      left: -120px;
    }

    .hero-art svg {
      width: min(82%, 390px);
      filter: drop-shadow(0 24px 18px rgba(92, 39, 20, 0.24));
      transform: rotate(-3deg);
    }

    .highlights {
      padding: clamp(54px, 7vw, 86px);
      background: #f7edd9;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Batang", serif;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .section-heading p {
      margin: 0 0 4px;
      color: #6f5d4d;
      font-weight: 700;
    }

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .highlight {
      min-height: 210px;
      padding: 26px;
      background: var(--paper-light);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .highlight-number {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 44px;
      color: var(--paper-light);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 700;
      background: var(--pumpkin);
      border-radius: 50%;
      place-items: center;
    }

    .highlight h3 {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 1.55rem);
      line-height: 1.4;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .highlight code {
      padding: 0.12em 0.35em;
      color: var(--pumpkin-dark);
      font-family: inherit;
      font-size: 0.92em;
      background: #f8ddbd;
      border-radius: 5px;
    }

    .rsvp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 34px;
      padding: clamp(48px, 7vw, 80px);
      color: var(--paper-light);
      background: var(--leaf);
    }

    .rsvp h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", "Batang", serif;
      font-size: clamp(2rem, 4vw, 3.3rem);
      letter-spacing: -0.035em;
    }

    .rsvp p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.86;
    }

    .rsvp-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 27px;
      color: var(--ink);
      font-size: 1.02rem;
      font-weight: 800;
      text-decoration: none;
      background: var(--paper-light);
      border: 2px solid var(--paper-light);
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(30, 41, 25, 0.24);
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .rsvp-button:hover {
      color: var(--paper-light);
      background: transparent;
      transform: translateY(-2px);
    }

    .rsvp-button:focus-visible {
      outline: 4px solid #ffcf70;
      outline-offset: 4px;
    }

    @media (max-width: 800px) {
      .invite {
        width: min(100% - 24px, 620px);
        margin: 12px auto;
        border-radius: 20px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-copy {
        padding: 48px 28px;
      }

      .hero-art {
        min-height: 360px;
      }

      .highlights {
        padding: 48px 24px;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 10px;
      }

      .highlight-grid {
        grid-template-columns: 1fr;
      }

      .highlight {
        min-height: auto;
      }

      .highlight-number {
        margin-bottom: 24px;
      }

      .rsvp {
        align-items: stretch;
        flex-direction: column;
        padding: 48px 28px;
      }

      .rsvp-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .rsvp-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="invite">
    <section class="hero" aria-labelledby="event-title">
      <div class="hero-copy">
        <p class="eyebrow">CLOUDBERRY POP-UP</p>
        <h1 id="event-title">종이와 호박 <span>— 클라우드베리 팝업</span></h1>
        <p class="intro">가을의 질감과 색을 담은 문구를 한자리에서 만나보세요. 천천히 둘러보고, 직접 만들고, 마음에 드는 종이를 골라 가세요.</p>

        <dl class="event-details">
          <div>
            <dt>언제</dt>
            <dd>10월 10일 토요일 · 11:00–18:00</dd>
          </div>
          <div>
            <dt>어디서</dt>
            <dd>성수 파이크스튜디오</dd>
          </div>
        </dl>
      </div>

      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 420 430" role="img">
          <path d="M205 104c-6-37 4-63 32-79 14 25 8 55-17 88" fill="#526148"/>
          <path d="M226 68c26-17 54-18 82-2-14 31-46 45-83 35" fill="#708164"/>
          <ellipse cx="210" cy="258" rx="155" ry="130" fill="#f8c46d"/>
          <ellipse cx="143" cy="258" rx="92" ry="128" fill="#ee8a3b"/>
          <ellipse cx="277" cy="258" rx="92" ry="128" fill="#ee8a3b"/>
          <ellipse cx="210" cy="258" rx="75" ry="132" fill="#f3a64a"/>
          <path d="M105 335c60 52 153 61 216 4" fill="none" stroke="#9f3f22" stroke-linecap="round" stroke-width="5" opacity=".28"/>
          <circle cx="105" cy="150" r="7" fill="#fffaf0"/>
          <circle cx="327" cy="143" r="5" fill="#fffaf0"/>
          <path d="m338 192 5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#fffaf0"/>
        </svg>
      </div>
    </section>

    <section class="highlights" aria-labelledby="highlights-title">
      <div class="section-heading">
        <h2 id="highlights-title">이날만의 즐거움</h2>
        <p>보고 · 만들고 · 할인받고</p>
      </div>

      <div class="highlight-grid">
        <article class="highlight">
          <span class="highlight-number" aria-hidden="true">1</span>
          <h3>데스크 플래너 2027 최초 공개</h3>
        </article>
        <article class="highlight">
          <span class="highlight-number" aria-hidden="true">2</span>
          <h3>나만의 카드 스탬프 코너</h3>
        </article>
        <article class="highlight">
          <span class="highlight-number" aria-hidden="true">3</span>
          <h3>코드 <code>PUMPKIN10</code>으로 10% 할인</h3>
        </article>
      </div>
    </section>

    <section class="rsvp" aria-labelledby="rsvp-title">
      <div>
        <h2 id="rsvp-title">성수에서 만나요.</h2>
        <p>참석 여부와 함께 궁금한 점을 메일로 보내주세요.</p>
      </div>
      <a class="rsvp-button" href="mailto:rsvp@cloudberry.example?subject=%EC%A2%85%EC%9D%B4%EC%99%80%20%ED%98%B8%EB%B0%95%20%ED%8C%9D%EC%97%85%20RSVP" aria-label="클라우드베리 팝업 참석 여부를 이메일로 보내기">RSVP 메일 보내기</a>
    </section>
  </main>
</body>
</html>
